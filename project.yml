name: SignMe
options:
  bundleIdPrefix: com.signme.verify
targets:
  SignMe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SignMe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.signme.verify.SignMe
        DEVELOPMENT_TEAM: D9K5CU789M
        CODE_SIGN_IDENTITY: iPhone Developer
        # Swift 5 language mode. Moving to 6 (strict concurrency) is a separate migration.
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - SignMeTests

  SignMeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SignMeTests
    dependencies:
      - target: SignMe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.signme.verify.SignMeTests
        DEVELOPMENT_TEAM: D9K5CU789M
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
