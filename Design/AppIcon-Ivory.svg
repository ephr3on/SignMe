<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <radialGradient id="bg" cx="50%" cy="36%" r="78%">
    <stop offset="0" stop-color="#FFFBF1"/><stop offset="0.6" stop-color="#F3EBD8"/><stop offset="1" stop-color="#E0D3B5"/>
  </radialGradient>
  <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="200" y1="230" x2="840" y2="850">
    <stop offset="0" stop-color="#E7C46C"/><stop offset="0.5" stop-color="#C6942C"/><stop offset="1" stop-color="#8A6016"/>
  </linearGradient>
  <radialGradient id="iris" gradientUnits="userSpaceOnUse" cx="460" cy="446" r="157.5">
    <stop offset="0" stop-color="#FFF3C8"/><stop offset="0.55" stop-color="#E3B34E"/><stop offset="1" stop-color="#9A6A1C"/>
  </radialGradient>
  <radialGradient id="sclera" gradientUnits="userSpaceOnUse" cx="494" cy="456" r="330">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDE3CC"/>
  </radialGradient>
  <clipPath id="eye"><path d="M180 506 C 300 352, 650 330, 800 472 C 660 624, 320 632, 180 506 Z"/></clipPath>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.2"/>
  </filter>
  <filter id="inner" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
  </filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<g transform="translate(-22 2)">
  <!-- eyeball: sclera, then the iris tucked under both lids -->
  <g clip-path="url(#eye)">
    <path d="M180 506 C 300 352, 650 330, 800 472 C 660 624, 320 632, 180 506 Z" fill="url(#sclera)"/>
    <g filter="url(#inner)">
      <circle cx="494" cy="486" r="126" fill="url(#iris)"/>
    </g>
    <circle cx="494" cy="486" r="122" fill="none" stroke="#13213D" stroke-opacity="0.35" stroke-width="7"/>
    <g stroke="#13213D" stroke-opacity="0.55" stroke-linecap="round"><line x1="494.0" y1="390.0" x2="494.0" y2="372.0" stroke-width="9"/><line x1="545.0" y1="397.7" x2="551.0" y2="387.3" stroke-width="5"/><line x1="582.3" y1="435.0" x2="592.7" y2="429.0" stroke-width="5"/><line x1="590.0" y1="486.0" x2="608.0" y2="486.0" stroke-width="9"/><line x1="582.3" y1="537.0" x2="592.7" y2="543.0" stroke-width="5"/><line x1="545.0" y1="574.3" x2="551.0" y2="584.7" stroke-width="5"/><line x1="494.0" y1="582.0" x2="494.0" y2="600.0" stroke-width="9"/><line x1="443.0" y1="574.3" x2="437.0" y2="584.7" stroke-width="5"/><line x1="405.7" y1="537.0" x2="395.3" y2="543.0" stroke-width="5"/><line x1="398.0" y1="486.0" x2="380.0" y2="486.0" stroke-width="9"/><line x1="405.7" y1="435.0" x2="395.3" y2="429.0" stroke-width="5"/><line x1="443.0" y1="397.7" x2="437.0" y2="387.3" stroke-width="5"/></g>
    <!-- soft shading so the iris reads as round -->
    <circle cx="494" cy="486" r="126" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="22" transform="translate(6 10)"/>
  </g>
  <!-- pupil with clock hands growing out of it -->
  <circle cx="494" cy="486" r="27" fill="#13213D"/>
  <polyline points="438.6,454.0 494,486 580.6,436.0" fill="none" stroke="#13213D" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- catchlight -->
  <ellipse cx="544" cy="520" rx="13" ry="9" fill="#FFFFFF" fill-opacity="0.85" transform="rotate(-25 544 520)"/>
  <circle cx="566" cy="536" r="4.5" fill="#FFFFFF" fill-opacity="0.6"/>
  <!-- lids, brow and markings on top -->
  <g filter="url(#shadow)">
    <path d="M176 352 C 330 246, 660 232, 858 296 C 878 302, 876 330, 856 328 C 660 280, 360 296, 196 384 C 176 394, 162 362, 176 352 Z" fill="url(#metal)"/>
    <g fill="none" stroke="url(#metal)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M180 506 C 300 352, 650 330, 800 472 L 892 472" stroke-width="50"/>
      <path d="M180 506 C 320 632, 660 624, 800 472" stroke-width="36"/>
      <path d="M590 608 C 616 690, 678 754, 770 764 C 850 772, 884 704, 842 670 C 806 640, 760 670, 782 706" stroke-width="42"/>
    </g>
    <path d="M404 580 L 466 580 L 436 812 C 433 838, 393 838, 392 812 Z" fill="url(#metal)"/>
  </g>
</g>
</svg>